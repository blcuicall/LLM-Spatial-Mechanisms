      const metric = metricSelect.value;

      const series = indices.map(i => {
        const ds = DATASETS[i];

          symbolSize: 6,
          lineStyle: { width: 2 },

            data: [{ value: y[ds.best_layer], coord: [ds.best_layer, y[ds.best_layer]], name: 'best' }],

            symbolSize: 40,
            itemStyle: { color: COLORS[i] || '#888' },
            label: { show: true, formatter: 'best' },
          };
